<!-- templates/users_list.html -->
<!DOCTYPE html>
<html>
<head>
    <title>لیست کاربران</title>
    <style>
        body {
            text-align: center;
        }
        h1 {
            margin-top: 20px;
        }
        #myButton {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #users-table th, #users-table td {
            padding: 10px;
            text-align: center;
        }
        #users-table th {
            background-color: #f2f2f2;
        }
        #users-table tr:nth-child(even) {
            background-color: #ffffff;
        }
        #users-table tr:nth-child(odd) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>لیست کاربران</h1>
    <a id="myButton" href="{% url 'account:export_users_excel' %}">دریافت خروجی اکسل</a>
    <table border="1" id="users-table">
        <thead>
            <tr>
                <th>شماره کاربری</th>
                <th>نام کاربری</th>
                <th>آدرس ایمیل</th>
                <th>شماره موبایل</th>
                <th>مدرس بودن کاربر</th>
                <th>تاریخ عضویت</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone_number }}</td>
                    <td>{{ user.is_teacher }}</td>
                    <td>{{ user.date_joined }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
