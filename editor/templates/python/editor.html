<!DOCTYPE html>
<html lang="en">

<body>
    <script src="{% static 'assets/editor/python/before_script.js' %}"></script>
    <div class="container2">
        <button id="toggleNave" type="button"><svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 448 512"><!--! Font Awesome Free 6.4.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2023 Fonticons, Inc. --><path d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z"/></svg></button>
        <div class="container-2">
            <button id="run" type="button" onclick="runit()">Run</button>
            <input type="file" id="fileInput" style="display: none;">
            <button id="saveButton" type="button" class="btn-action" onclick="">save</button>
            
            <button id="download-file" type="button" onclick="download_file()">download</button>
            <button id="openFileButton" type="button" class="btn-action" onclick="">open</button>
            <button id="closeNav">close</button>
        </div>
    </div>
    <div class="container-2">
        
{% csrf_token %}
        <!-- <div class="container-1">
        
            </div> -->

        <div class="container">

            <div class="top-view">
                <div id="editor">{{ initial_value }}</div>
            </div>


            <div class="bottom-pane-border">

                <div class="output-header"><button onclick="download_terminal()" id="save-terminal"
                        style="background: #282a36; border: none; color: aliceblue; padding: 3.8px;">terminal:</button>
                </div>


                <div id="output" class="bottom-pane">
                </div>
            </div>
        </div>
    </div>

  <script src="{% static 'assets/editor/python/after_script.js' %}"></script>
