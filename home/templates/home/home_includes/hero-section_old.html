{% load static %}

<section class="hero-section d-block d-sm-flex">
        <div class="container">
            <div class="row align-items-center" style="flex-wrap: wrap-reverse;">
                <div class="col-xl-6 col-md-12 mt-2">
                    <h1 class="fw-bold display-4 mb-0 text-light title">

                        کدنا یعنی طی مسیری با کیفیت!

                    </h1>
                    <p class="mt-4 lh-lg fs-5 mb-0 text-secondary">
                        توی آکادمی کدنا، بدون برنامه پیش نمیری، بلکه با توجه به هدفت و نظر متخصصین بهترین و بی نقص ترین
                        نقشه راه رو جلو میبری...
                    </p>
                    <button class="btn btn-action shadow btn-lg mt-4">
                        <span>بزن بریم!</span>
                    </button>
                </div>
                <div class="col-xl-6 col-md-12 mt-2">
                    <div class="swiper" id="heroSlider">

                        <div class="swiper-wrapper">
                            {% for i in main_slider %}
                                <div class="swiper-slide">
                                    <a href=' {{ i.link }} '><img src="{{ i.image.url }}" class="img-fluid rounded-4"
                                                                  alt=""></a>
                                </div>
                            {% endfor %}
                        </div>

                        <div
                                class="swiper-button-next btn rounded-circle d-flex align-items-center justify-content-center swiper-button-next-hero shadow">
                            <svg x="0px" y="0px" id="nextIcon" viewBox="0 0 32 32"
                                 style="enable-background:new 0 0 32 32;">
                                <path d="M11.5,26c-0.3,0-0.5-0.1-0.7-0.3c-0.4-0.4-0.4-1,0-1.4l8.3-8.3l-8.3-8.3c-0.4-0.4-0.4-1,0-1.4s1-0.4,1.4,0l9,9
            c0.4,0.4,0.4,1,0,1.4l-9,9C12,25.9,11.8,26,11.5,26z"/>
                            </svg>

                        </div>
                        <div
                                class="swiper-button-prev btn rounded-circle d-flex align-items-center justify-content-center swiper-button-prev-hero shadow">
                            <svg x="0px" y="0px" id="prevIcon" viewBox="0 0 32 32"
                                 style="enable-background:new 0 0 32 32;">
                                <path d="M11.5,26c-0.3,0-0.5-0.1-0.7-0.3c-0.4-0.4-0.4-1,0-1.4l8.3-8.3l-8.3-8.3c-0.4-0.4-0.4-1,0-1.4s1-0.4,1.4,0l9,9
            c0.4,0.4,0.4,1,0,1.4l-9,9C12,25.9,11.8,26,11.5,26z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
