{% load static %}

<section class="section-height-fit blog">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between title-and-show-more">
                <h1 class="text-light fw-bold fm-morabba d-flex align-items-center gap-3">
                    <svg id="news" width="45" height="45">
                        <path d="M43,11H40V39a3,3,0,0,0,6,0V14A3,3,0,0,0,43,11Z" />
                        <rect x="8" y="15" width="9" height="8" />
                        <path
                            d="M38,39V10a4,4,0,0,0-4-4H6a4,4,0,0,0-4,4V39a3,3,0,0,0,3,3H39.026A4.948,4.948,0,0,1,38,39ZM6,15a2,2,0,0,1,2-2h9a2,2,0,0,1,2,2v8a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2ZM33,35H7a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H7a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H23a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H23a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H23a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Z" />
                    </svg>
                    مقالات
                </h1>
                <button onclick="window.location.href='{% url "blog:start_page" %}'" class="btn more-btn">مشاهده ی همه ی مقالات</button>
            </div>
            <div class="row mt-3">

                {% for post in blog_post %}
                    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12 my-2">
                        <div class="card">
                            <a href="{% url 'blog:detail_page' pk=post.id slug=post.slug %}">
                                <img src="{% static 'assets/img/lazy-img.webp' %}" data-src="{{ post.image.url }}"
                                    class="lazy card-img-top rounded-4" alt="...">
                            </a>
                            <div class="card-body d-flex flex-column">
                                <h2 class="card-title fs-4 fw-bold">
                                    <a class="text-light" href="{% url 'blog:detail_page' pk=post.id slug=post.slug %}">
                                        {{ post.title }}
                                    </a>
                                </h2>
                                <p class="card-text text-justify">
                                   {{ post.snippet }}
                                </p>
                                <a href="" class="link-light">
                                    <div class="blog-card-footer d-flex align-items-center gap-2">
                                        <img class="rounded-circle blog-card-footer-avatar" src="{{ post.anthor.user_image.url }}"
                                            alt="">
                                        <span>{{ post.anthor.username }}</span>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                {% endfor %}



            </div>
        </div>
    </section>
