{% load static %}

<section class="section-height-fit mt-5">
        <div class="container">
            <h4 class="text-light fw-bold fm-morabba d-flex mb-0 align-items-center gap-3">
                <svg fill="#fff" width="30px" height="30px" viewBox="0 0 16 16" id="request-16px"
                    xmlns="http://www.w3.org/2000/svg">
                    <path id="Path_49" data-name="Path 49"
                        d="M30.5,16a.489.489,0,0,1-.191-.038A.5.5,0,0,1,30,15.5V13h-.5A2.5,2.5,0,0,1,27,10.5v-8A2.5,2.5,0,0,1,29.5,0h11A2.5,2.5,0,0,1,43,2.5v8A2.5,2.5,0,0,1,40.5,13H33.707l-2.853,2.854A.5.5,0,0,1,30.5,16Zm-1-15A1.5,1.5,0,0,0,28,2.5v8A1.5,1.5,0,0,0,29.5,12h1a.5.5,0,0,1,.5.5v1.793l2.146-2.147A.5.5,0,0,1,33.5,12h7A1.5,1.5,0,0,0,42,10.5v-8A1.5,1.5,0,0,0,40.5,1ZM36,9a1,1,0,1,0-1,1A1,1,0,0,0,36,9Zm1-4a2,2,0,0,0-4,0,.5.5,0,0,0,1,0,1,1,0,1,1,1,1,.5.5,0,0,0,0,1A2,2,0,0,0,37,5Z"
                        transform="translate(-27)" />
                </svg>
                سوالات متداول
            </h4>
            <p class="text-secondary text-justify mt-3">
                برای شروع آموزش در هر نقشه راه شاید سوالاتی برات پیش بیاد. ما عمومی ترین سوالات اینجا با جواب برات آماده
                کردیم
            </p>

            {% for q in questions %}
            <div class="accordion-course mt-3">
                <label for="touch">
                    <span class="d-flex align-items-center accordion-course__text">
                        <svg fill="#fff" width="18px" height="18px" viewBox="0 0 16 16" id="request-added-16px"
                            xmlns="http://www.w3.org/2000/svg">
                            <path id="Path_48" data-name="Path 48"
                                d="M-6.5,0h-11A2.5,2.5,0,0,0-20,2.5v8A2.5,2.5,0,0,0-17.5,13h.5v2.5a.5.5,0,0,0,.309.462A.489.489,0,0,0-16.5,16a.5.5,0,0,0,.354-.146L-13.293,13H-6.5A2.5,2.5,0,0,0-4,10.5v-8A2.5,2.5,0,0,0-6.5,0ZM-5,10.5A1.5,1.5,0,0,1-6.5,12h-7a.5.5,0,0,0-.354.146L-16,14.293V12.5a.5.5,0,0,0-.5-.5h-1A1.5,1.5,0,0,1-19,10.5v-8A1.5,1.5,0,0,1-17.5,1h11A1.5,1.5,0,0,1-5,2.5Zm-3.5-4A.5.5,0,0,1-9,7h-2.5V9.5a.5.5,0,0,1-.5.5.5.5,0,0,1-.5-.5V7H-15a.5.5,0,0,1-.5-.5A.5.5,0,0,1-15,6h2.5V3.5A.5.5,0,0,1-12,3a.5.5,0,0,1,.5.5V6H-9A.5.5,0,0,1-8.5,6.5Z"
                                transform="translate(20)" />
                        </svg>
                        {{ q.name }}
                        <span class="accordion-course__icon ms-auto">
                            +
                        </span>
                    </span>
                </label>
                <input type="checkbox" id="touch">
                <ul class="accordion-course__item">
                    <div class="accordion-course__item-container">
                        {{ q.description | safe }}
                    </div>
                </ul>
            </div>
            {% endfor %}





        </div>
    </section>
