{% load static %}

   <section class="mt-5">
        <div class="container">
            <div class="row">
                <div class="col-xl-8 mx-auto text-center">
                    <div class="section-title">
                        <h1 class="fw-bold fm-morabba text-light">نقشه راه یادگیری برنامه نویسی</h1>
                        <p class="mt-3 text-secondary fs-5">با این نقشه ی راه دیگه خیالت راحت باشه (=:</p>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-12">
                    <ul class="timeline-list ">

                        {% for object in object_list  %}



                        <!-- Single Experience -->
                        <li>
                            <span class="number">{{ object.course_number }}</span>
                            <div class="timeline_content card flat-card shadow">
                                <img src="{{ object.course.course_image.url }}" class="card-img rounded-4" alt="">
                                <div class="card-body p-0 pt-3">
                                    <p class="text-primary card-title fw-bold">{{ object.course.name }}</p>
                                    <p class="card-text">{{ object.course.teacher.username }}</p>
                                    <p class="card-text text-secondary text-justify">
                                       {{ object.course.small_description }}
                                    </p>
                                     <button onclick=" window.open('{% url 'home:course_detail' object.course.id object.course.slug %}')" class="btn">یادگیری را شروع کنید</button>
                                </div>
                            </div>
                        </li>
                        <!-- Single Experience -->

                        {% endfor %}


                    </ul>
                </div>
            </div>
        </div>
    </section>
