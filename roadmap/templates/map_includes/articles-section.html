{% load static %}

<section>
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <h1 class="text-light fw-bold fm-morabba d-flex align-items-center gap-3">
                    <svg id="news" width="45" height="45">
                        <path d="M43,11H40V39a3,3,0,0,0,6,0V14A3,3,0,0,0,43,11Z" />
                        <rect x="8" y="15" width="9" height="8" />
                        <path
                            d="M38,39V10a4,4,0,0,0-4-4H6a4,4,0,0,0-4,4V39a3,3,0,0,0,3,3H39.026A4.948,4.948,0,0,1,38,39ZM6,15a2,2,0,0,1,2-2h9a2,2,0,0,1,2,2v8a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2ZM33,35H7a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H7a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H23a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H23a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Zm0-5H23a1,1,0,0,1,0-2H33a1,1,0,0,1,0,2Z" />
                    </svg>
                    مقالات
                </h1>
            </div>
            <div class="swiper" id="sliderPosts">
                <div class="swiper-wrapper">
                    {% for item in articles %}
                    <div class="swiper-slide">
                        <div class="card">
                            <img src="{{ item.image.url }}" class="card-img-top rounded-4" alt="...">
                            <div class="card-body">
                                <h2 class="card-title text-light fs-5">{{ item.title }}</h2>
                                <div class="row justify-content-between my-4">
                                    <div class="col-auto">
                                        <a href="" class="link-light">{{ item.anthor.username }}</a>
                                    </div>
                                    <div class="col-auto">
                                        <span class="text-light">{{ item.date }}</span>
                                    </div>
                                </div>
                                <div class="card-footer border-light d-flex align-items-center justify-content-between">
                                    <button onclick=" window.open('{% url 'blog:detail_page' item.id item.slug %}')" class="btn mt-2">ادامه مقاله</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}



                </div>
                <div class="swiper-button-next btn rounded-circle d-flex align-items-center justify-content-center">
                    <svg x="0px" y="0px" id="nextIcon" viewBox="0 0 32 32" style="enable-background:new 0 0 32 32;">
                        <path d="M11.5,26c-0.3,0-0.5-0.1-0.7-0.3c-0.4-0.4-0.4-1,0-1.4l8.3-8.3l-8.3-8.3c-0.4-0.4-0.4-1,0-1.4s1-0.4,1.4,0l9,9
    c0.4,0.4,0.4,1,0,1.4l-9,9C12,25.9,11.8,26,11.5,26z" />
                    </svg>

                </div>
                <div class="swiper-button-prev btn rounded-circle d-flex align-items-center justify-content-center">
                    <svg x="0px" y="0px" id="prevIcon" viewBox="0 0 32 32" style="enable-background:new 0 0 32 32;">
                        <path d="M11.5,26c-0.3,0-0.5-0.1-0.7-0.3c-0.4-0.4-0.4-1,0-1.4l8.3-8.3l-8.3-8.3c-0.4-0.4-0.4-1,0-1.4s1-0.4,1.4,0l9,9
    c0.4,0.4,0.4,1,0,1.4l-9,9C12,25.9,11.8,26,11.5,26z" />
                    </svg>
                </div>
            </div>
            <button onclick=" window.open('{% url 'blog:start_page' %}')" class="btn mt-4 d-block mx-auto">مشاهده ی همه</button>
        </div>
    </section>
    <style>
        .section-title h1:before {
            background-color: {{ map.color }};
        }

        .section-title h1:after {
            background-color: {{ map.color }};
        }

        .number {
            background-color: {{ map.color }};
        }

        ul.timeline-list:before {
            background-color: {{ map.color }};
        }

        .text-primary {
            color: {{ map.color }} !important;
        }
    </style>
